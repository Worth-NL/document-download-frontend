name: PR

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/worth-nl/document-download-frontend

jobs:
  unit-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]
        node-version: ["24"]

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Amsterdam"

      - uses: actions/checkout@v4

      - uses: gerlero/apt-install@v1
        with:
          packages: build-essential git libcurl4-openssl-dev curl libssl-dev
          install-recommends: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            requirements_nl.txt
            requirements_nl_test.txt

      - name: Install application requirements (pip)
        run: uv pip install -r requirements_nl_test.txt

      - name: NPM install
        run: npm ci --no-audit

      - name: NPM build
        run: npm run build

      - uses: astral-sh/ruff-action@v3
        with:
          version-file: requirements_nl_test.txt

      - name: Generate version file
        run: make generate-version-file

      - name: NPM lint SCSS
        run: npm run lint:scss

      - name: NPM lint JS
        run: npm run lint:js

      - uses: pavelzw/pytest-action@v2
        with:
          job-summary: false
          verbose: false
          emoji: false
          custom-arguments: --junitxml=reports/pytest-unit.xml
          custom-pytest: uv run pytest

      - uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: PyTest Tests
          path: reports/pytest-*.xml
          reporter: java-junit
          only-summary: true
          use-actions-summary: false
          badge-title: PYTEST

  docker-test:
    runs-on: ubuntu-latest

    needs: unit-test

    strategy:
      matrix:
        python-version: ["3.13"]
        dockerfile-target: ["test"]

    steps:
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Amsterdam"

      - uses: actions/checkout@v4

      - uses: gerlero/apt-install@v1
        with:
          packages: build-essential git libcurl4-openssl-dev curl libssl-dev
          install-recommends: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            requirements_nl.txt
            requirements_nl_test.txt

      - name: Install application requirements (pip)
        run: uv pip install -r requirements_nl_test.txt

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile_nl
          load: true
          tags: ${{ env.IMAGE }}:test-${{ matrix.dockerfile-target }}
          platforms: linux/amd64
          provenance: false
          target: ${{ matrix.dockerfile-target }}

  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    needs: docker-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set tag
        id: set-tag
        run: |
          TAG=$(date +%Y%m%d).${{ github.run_number }}-pr
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile_nl
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.set-tag.outputs.tag }}
          platforms: linux/amd64
          provenance: false

    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}

  deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: Test
      url: https://download.test.notifynl.nl

    permissions:
      contents: read
      pull-requests: write

    env:
      HELM_SET_ARGS: >-
        --set apps.documentDownloadFrontend.image.tag=${{ needs.build.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Worth-NL/notifynl-charts-private
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
        name: Checkout Worth-NL/notifynl-charts-private

      # K8S_CONFIG is stored base64-encoded (shared with the other submodules'
      # workflows, which still use bwvolleyball/k8s-toolkit and decode it
      # internally). azure/k8s-set-context's `kubeconfig` method expects raw
      # kubeconfig YAML, not base64, so decode it here first.
      - name: Decode kubeconfig
        id: decode-kubeconfig
        run: |
          {
            echo "content<<KUBECONFIG_EOF"
            echo "${{ secrets.K8S_CONFIG }}" | base64 -d
            echo "KUBECONFIG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ steps.decode-kubeconfig.outputs.content }}

      # --reset-then-reuse-values and --rollback-on-failure below are Helm 4
      # flag names; the runner's default Helm 3 would reject both.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.2

      - name: Helm chart dependency build
        run: helm dependency build
        working-directory: ${{ github.workspace }}/notifynl-full

      # Renders the chart and validates against the live cluster API/CRDs
      # (required/fail template checks included) without persisting anything
      # or scheduling any pods. Uses the exact same flags as the real deploy
      # below so it can't drift out of sync and give a false pass.
      - name: Pre-flight validation (dry-run, no cluster mutation)
        id: helm-dry-run
        run: |
          set -x
          helm upgrade --install notifynl notifynl-full/ \
          -n ${{ vars.NAMESPACE }} \
          --reset-then-reuse-values \
          $HELM_SET_ARGS \
          --rollback-on-failure \
          --dry-run=server

      - name: Deploy new tag
        id: helm-deploy
        run: |
          set -x
          helm upgrade --install notifynl notifynl-full/ \
          -n ${{ vars.NAMESPACE }} \
          --reset-then-reuse-values \
          $HELM_SET_ARGS \
          --rollback-on-failure \
          --timeout 300s

      - name: Comment on PR if deployment fails
        if: failure() && (steps.helm-dry-run.outcome == 'failure' || steps.helm-deploy.outcome == 'failure') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const dryRunFailed = "${{ steps.helm-dry-run.outcome }}" === "failure";
            const body = dryRunFailed
              ? [
                  "⚠️ **Test environment deployment blocked (pre-flight check failed)**",
                  "",
                  "- Environment: `Test`",
                  "- Image tag: `${{ needs.build.outputs.tag }}`",
                  "",
                  "The pre-flight `helm upgrade --dry-run=server` check failed, so the real deploy never ran — **the cluster was not touched**, nothing to clean up.",
                  "",
                  "This validates the whole `notifynl-full` release, not just this service, so the fault may be elsewhere in the chart. Most likely causes:",
                  "- A required value is unset — e.g. `apps.documentDownloadFrontend.host`, which the ingress template declares `required`. `--reset-then-reuse-values` only carries forward values previously supplied via `--set`/`-f`, so anything never seeded stays missing.",
                  "- `notifynl-full` added a value with no chart default. Seed it once with a manual `helm upgrade --set <key>=<value>` and later deploys carry it forward automatically."
                ].join("\n")
              : [
                  "❌ **Test environment deployment failed**",
                  "",
                  "- Environment: `Test`",
                  "- Image tag: `${{ needs.build.outputs.tag }}`",
                  "",
                  "The pre-flight check passed, so the chart renders — this failed while rolling out. `--rollback-on-failure` means Helm has **already attempted to roll the release back**; confirm that rollback actually succeeded rather than assuming a clean state.",
                  "",
                  "Most likely causes:",
                  "- The image is not pullable — ghcr.io package visibility, or expired/changed registry credentials.",
                  "- The new image starts but the container crash-loops, so the 300s timeout trips. This service has no readiness probe configured, so check the pod directly.",
                  "",
                  "Inspect with `kubectl -n <namespace> describe deploy document-download-frontend` and the pod logs."
                ].join("\n");
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })
